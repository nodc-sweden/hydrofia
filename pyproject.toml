[project]
name = "hydrofia"
version = "1.0.0"
description = "Calculation of pH from HydroFIA measurements"
authors = [
    {name = "a001985", email = "magnus.wenzer@smhi.se"},
]
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "flet[desktop]>=1.0,<2",
    "pillow>=13.0",
    "lxml>=6.0",
    "pyco2sys>=1.8,<2",
    "pyyaml>=6.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
hydrofia = "hydrofia.gui.flet_app:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flet[cli]>=1.0,<2",
    "pyinstaller>=6.10.0",
    "pytest>=9.2.0",
    "ruff>=0.17",
]
