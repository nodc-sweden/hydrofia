[project]
name = "hydrofia"
version = "1.0.0"
description = "Calculation of pH from HydroFIA measurements"
authors = [
    {name = "a001985", email = "magnus.wenzer@smhi.se"},
]
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "flet[desktop]>=1.0,<2",
    "pillow>=13.0",
    "lxml>=6.0",
    "pyco2sys>=1.8,<2",
    "pyyaml>=6.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
hydrofia = "hydrofia.gui.flet_app:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flet[cli]>=1.0,<2",
    "pyinstaller>=6.10.0",
    "pytest>=9.2.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["src/hydrofia/ext_src"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"src/hydrofia/utils.py" = ["S603", "S606", "S607"]  # opens files with the OS default app
"build_exe.py" = ["S603", "S607"]                    # runs the build tool
